# Memory tuning: this sandbox/CI has a 2GiB cgroup limit, so the daemon heap
# must stay small or the OOM killer kills the build. Kotlin compiles in-process
# to avoid extra worker JVMs.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
