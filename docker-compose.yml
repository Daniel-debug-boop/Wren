services:
  wren:
    build: .
    container_name: wren
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - wren-workspace:/workspace
      - wren-data:/root/.wren
    environment:
      - WORKSPACE_BASE=/workspace
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=3000
      - ENABLE_DOCS=false
      - WREN_CORS_ORIGINS=${WREN_CORS_ORIGINS:-http://localhost:3000}
      - WREN_SHELL=/bin/bash
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wren-workspace:
  wren-data:
